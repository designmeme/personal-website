name: quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Gatsby 5's React peer tree requires the same legacy peer resolution
      # that was used to create the existing lockfile.
      - run: npm ci --legacy-peer-deps
      # Gatsby generates the GraphQL `Queries` namespace during its build.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
